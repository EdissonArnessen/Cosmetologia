name: Publicar sitio en GitHub Pages

# Se ejecuta manualmente (o cuando actives GitHub Pages en modo "GitHub Actions").
# Nota: la PRIMERA activación de Pages debe hacerla el dueño del repositorio
# desde Settings -> Pages (GitHub no permite activarla por automatización).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar solo los archivos del sitio
        run: |
          mkdir -p _site/assets _site/.well-known _site/fonts
          cp index.html manifest.webmanifest sw.js favicon.svg robots.txt sitemap.xml _headers _site/ 2>/dev/null || true
          cp .nojekyll _site/.nojekyll 2>/dev/null || true
          cp -r assets/. _site/assets/ 2>/dev/null || true
          cp -r fonts/. _site/fonts/ 2>/dev/null || true
          cp -r .well-known/. _site/.well-known/ 2>/dev/null || true

      - name: Empaquetar para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
