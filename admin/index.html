<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Tatiana Hernández · Estética Integral</title>
<meta name="description" content="Panel de administración — Tatiana Hernández · Estética Integral">
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo">t<b>h</b></div>
    <div class="login-sub">Estética Integral</div>
    <h1 class="login-title">Panel de administración</h1>
    <p class="login-hint">Ingresa con tus credenciales.</p>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="tucorreo@ejemplo.com" required>
    </div>
    <div class="field">
      <label for="pass">Contraseña</label>
      <input type="password" id="pass" name="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <p class="err-msg" id="loginErr"></p>
    <button type="submit" class="btn btn-gold btn-block" id="loginBtn">Ingresar</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="app">
  <div class="sb-overlay" id="sbOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="l">Tatiana <b>Hernández</b></div>
      <div class="s">Estética Integral</div>
    </div>
    <nav class="sb-nav" id="sbNav"><!-- se arma según el rol --></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar" id="sbAvatar">—</div>
        <div>
          <div class="n" id="sbName">—</div>
          <div class="r" id="sbRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg></button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="spacer"></div>
    </header>
    <div class="content" id="view"><!-- vista activa --></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
