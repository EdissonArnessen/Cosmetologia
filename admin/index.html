<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>(function(){try{if(location.hostname.indexOf('github.io')>-1){var p=location.pathname.replace(/^\/Cosmetologia/,'');location.replace('https://tatianahernandez.web.app'+(p||'/')+location.search+location.hash);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Tatiana Hernández · Estética Integral</title>
<meta name="description" content="Panel de administración — Tatiana Hernández · Estética Integral">
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- ============ LOGIN (vidrio) ============ -->
<div class="login-wrap" id="loginWrap">
  <div class="login-bg"></div>
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <form class="glass-card" id="loginForm" autocomplete="on">
    <div class="logo-plate">
      <div class="wordmark wordmark-lg">
        <span class="wm-th">th<svg class="wm-swash" viewBox="0 0 100 14" aria-hidden="true"><path d="M3 6 Q50 15 97 5"/></svg></span>
        <span class="wm-txt"><b>Tatiana Hernández</b><small>Estética Integral</small></span>
      </div>
    </div>
    <h1>Bienvenida de nuevo</h1>
    <p class="gc-hint">Ingresa a tu panel de administración</p>
    <div class="in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
    </div>
    <div class="in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input type="password" id="pass" name="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
      <button type="button" class="eye" id="eyeBtn" aria-label="Mostrar u ocultar contraseña">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="gc-row">
      <label><input type="checkbox" id="remember"> Recordarme</label>
      <span></span>
    </div>
    <p class="err-msg" id="loginErr"></p>
    <button type="submit" class="gc-btn" id="loginBtn">Ingresar →</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="app">
  <div class="sb-overlay" id="sbOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="wordmark">
        <span class="wm-th">th<svg class="wm-swash" viewBox="0 0 100 14" aria-hidden="true"><path d="M3 6 Q50 15 97 5"/></svg></span>
        <span class="wm-txt"><b>Tatiana Hernández</b><small>Estética Integral</small></span>
      </div>
    </div>
    <nav class="sb-nav" id="sbNav"><!-- se arma según el rol --></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar" id="sbAvatar">—</div>
        <div>
          <div class="n" id="sbName">—</div>
          <div class="r" id="sbRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg></button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="spacer"></div>
    </header>
    <div class="content" id="view"><!-- vista activa --></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
